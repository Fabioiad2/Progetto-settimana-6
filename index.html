<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier — Studio di architettura</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>

    <header>
      <!-- Navbar Bootstrap (navbar-expand-md, sticky in cima) -->
       <nav class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container">

    <!-- Logo a sinistra -->
    <a class="navbar-brand fw-bold" href="#">
      EpiShop
    </a>

    <!-- Hamburger su mobile -->
    <button class="navbar-toggler" type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Apri menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menu a destra su desktop -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link text-white" href="#">
            Prodotti
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-white" href="#">
            Offerte
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-white" href="#">
            Contatti
          </a>
        </li>

      </ul>
      <button id="toggle-tema" type="button"
        class="btn btn-outline-light ms-md-2 mt-2 mt-md-0">
        Tema scuro
      </button>
    </div>

  </div>
</nav>
    </header>

    <section id="studio">
      <!-- Hero: titolo grande, sottotitolo, CTA. Sfondo brand. min-height 80vh -->
       <div class="hero container-fluid d-flex flex-column align-items-center justify-content-center text-light">
        <h2>Architettura per spazi che parlano</h2>
        <p>Progettiamo case, uffici e spazi commerciali con attenzione alla luce, ai materiali e al contesto</p>
        <button class="btn text-light">Cta</button>
       </div>
    </section>

    <section id="servizi">
      <!-- 3 card servizi affiancate da md in su -->
    </section>

    <section id="contatti">
      <!-- Form contatti Bootstrap, larghezza limitata e centrata -->
    </section>

    <footer>
      <!-- 3 colonne: Atelier+indirizzo / Link / Contatti. Copyright in fondo -->
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
